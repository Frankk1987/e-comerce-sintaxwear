<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Ecommerce</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>

<body>
  <header class="site-header" role="banner">


  </header>

  <main>
    <section class="hero">
      <!-- estrutura da seção heroe (vazia por enquanto) -->
    </section>

    <section class="categories">
      <div class="container">
        <!-- container para categorias de tênis (macro) -->
      </div>
    </section>

    <section class="featured-products">
      <div class="container">
        <div class="product-grid">
          <!-- grid de produtos - estruturas dos cards vão aqui -->
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div class="contact">
        <!-- informações de contato -->
      </div>
      <div class="footer-links">
        <!-- links de rodapé -->
      </div>
    </div>
  </footer>
</body>

</html>
